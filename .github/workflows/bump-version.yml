name: Tag Version (manual)

# Manual release-tagging helper, not part of any automatic gate. The automatic
# `pull_request: closed` trigger is disabled: a release is prepared and published by
# the maintainer (`docs/workflow/release.md` — bump `release.json`, tag, build the
# images and the exe, upload the assets), so nothing may mint a tag on its own. The
# job is kept for a **manual** run only, and it is still public-repository-only,
# because that is where the product tag history lives.
#
# This file is published verbatim, and a run in a tree without `v*` tags rests on
# the action's `0.0.0` baseline instead: it would mint `v0.0.1` on a merge that
# releases nothing (twice so far, 2026-11-24 and 2026-11-25). A `v*` tag that
# exists in two clones of this repository also makes fetching tags fail with
# `would clobber existing tag`.
# The guard names the public repository, so moving or renaming it needs this line
# updated.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  bump-version:
    # Public repository only: see the header. A manual **Run workflow** is the only
    # trigger now, so the tag is minted on demand instead of on every merge.
    if: github.repository == 'dodeka12/micro-otter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Require a version baseline
        # `github-tag-action` derives the next version from the existing `v*` tags alone and falls
        # back to `0.0.0` when there is none. Fail loudly instead of publishing a tag that
        # corresponds to no release; the baseline is restored by creating the missing tag by hand.
        run: |
          git fetch --tags --quiet origin
          baseline="$(git tag --list 'v[0-9]*' | sort -V | tail -n 1)"
          if [ -z "$baseline" ]; then
            echo "::error::No 'v*' tag exists, so the next tag would be v0.0.1. Restore the release-tag baseline first."
            exit 1
          fi
          echo "Version baseline: ${baseline}"

      - name: Determine semver bump from commit titles
        id: determine-bump
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setOutput('bump', 'patch');
              return 'patch';
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const candidates = [];

            if (pr.title) {
              candidates.push(pr.title);
            }

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              },
              (response) => response.data
            );

            for (const commit of commits) {
              if (commit?.commit?.message) {
                candidates.push(commit.commit.message);
              }
            }

            const priority = { patch: 1, minor: 2, major: 3 };

            const classify = (text) => {
              if (!text) {
                return null;
              }
              const normalized = text.trim();
              if (!normalized) {
                return null;
              }
              const lower = normalized.toLowerCase();
              if (lower.includes('breaking change')) {
                return 'major';
              }
              const firstLine = lower.split('\n')[0].trim();
              const match = firstLine.match(/^([a-z]+)(?:\([^)]+\))?(!)?:/);
              if (!match) {
                return null;
              }
              const [, type, bang] = match;
              if (bang || type === 'breaking') {
                return 'major';
              }
              if (type === 'feat') {
                return 'minor';
              }
              if (
                ['fix', 'perf', 'refactor', 'chore', 'docs', 'style', 'test', 'build', 'ci', 'revert'].includes(
                  type
                )
              ) {
                return 'patch';
              }
              return null;
            };

            let bump = 'patch';
            for (const candidate of candidates) {
              const classification = classify(candidate);
              if (!classification) {
                continue;
              }
              if (priority[classification] > priority[bump]) {
                bump = classification;
                if (bump === 'major') {
                  break;
                }
              }
            }

            core.info(`Determined bump level: ${bump}`);
            core.setOutput('bump', bump);
            return bump;

      - name: Bump semantic version tag
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCHES: main
          DEFAULT_BUMP: ${{ steps.determine-bump.outputs.bump }}
          WITH_V: true
