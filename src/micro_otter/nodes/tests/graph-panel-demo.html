<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Panel Demo - Interactive Node Graph Editor</title>
    <!-- Marked library for markdown parsing in NodeInfoView -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <link rel="stylesheet" href="../styles/standard/view-system.css">
    <link rel="stylesheet" href="../styles/standard/view-manager.css">
    <link rel="stylesheet" href="../styles/standard/split-view.css">
    <link rel="stylesheet" href="../styles/standard/text-view.css">
    <link rel="stylesheet" href="../styles/standard/html-view.css">
    <link rel="stylesheet" href="../styles/standard/node-type-ui.css">
    <link rel="stylesheet" href="../styles/standard/node-palette-view.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
            background: #0c0f16;
            color: #e5eaf3;
            overflow: hidden;
        }
        
        #app-container {
            width: 100vw;
            height: 100vh;
        }
        
        .header-content {
            padding: 12px 16px;
            background: #121927;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-content h1 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 600;
        }
        
        .header-content p {
            margin: 0;
            font-size: 11px;
            color: rgba(229, 234, 243, 0.75);
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .header-actions button {
            padding: 6px 12px;
            background: var(--mo-surface-2, #172133);
            border: 1px solid var(--mo-border, rgba(255, 255, 255, 0.12));
            border-radius: 4px;
            color: var(--mo-text, #e5eaf3);
            font-size: 11px;
            cursor: pointer;
            transition: background 120ms ease;
        }
        
        .header-actions button:hover {
            background: var(--mo-surface-1, #121927);
            border-color: var(--mo-accent, #63b5ff);
        }
        
        #graph-panel-container {
            width: 100%;
            height: 100%;
            background: #0f141f;
            position: relative;
        }
        
        .empty-graph-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(229, 234, 243, 0.5);
            font-size: 14px;
            pointer-events: none;
        }
        
        .empty-graph-message .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="app-container"></div>
    
    <script type="module">
        // Import logging system FIRST
        import '/html/js/core/log.js';
        
        import { ViewManager } from '../js/views/view-manager.js';
        import { SplitView } from '../js/views/split-view.js';
        import { HtmlView } from '../js/views/html-view.js';
        import { NodePaletteView } from '../js/views/node-palette-view.js';
        import { GraphPanelView } from '../js/views/graph-panel-view.js';
        import { DeviceRuntimeCollection } from '../js/data/device-runtime-collection.js';
        import { WorkspaceConfig } from '../js/data/workspace-config.js';
        import { Collection } from '../js/data/collection.js';
        import { NodeGraph } from '../js/data/node-graph.js';
        import { Workspace } from '../js/core/workspace.js';
        import { IconProvider } from '../js/views/icon-provider.js';
        import { I18nService } from '../js/i18n/i18n-service.js';
        import { generateUuidV4 } from '../js/data/uuid.js';
        
        let viewManager = null;
        let paletteView = null;
        let graphPanelView = null;
        let workspace = null;
        let collection = null;
        let nodeGraph = null;
        
        async function init() {
            try {
                // Enable logging system
                if (globalThis.__microOtterLog) {
                    const { logger } = globalThis.__microOtterLog;
                    logger.setEnabled(true);
                    logger.register('GraphPanelView');
                    logger.register('NodePaletteView');
                    logger.register('ViewManager');
                    logger.register('Workspace');
                    console.log('[Demo] Logging enabled for graph panel classes');
                }
                
                console.log('[Demo] Initializing Graph Panel Demo...');
                
                // Load device runtime collection
                console.log('[Demo] Loading device runtime collection...');
                const deviceRuntimeCollection = new DeviceRuntimeCollection('/device/runtime');
                await deviceRuntimeCollection.load();
                
                const activeRuntime = deviceRuntimeCollection.getActiveRuntime();
                if (!activeRuntime) {
                    throw new Error('No active runtime found');
                }
                
                console.log('[Demo] Runtime loaded:', activeRuntime.name || activeRuntime.id);
                console.log('[Demo] Node packages:', activeRuntime.nodePackages.length);
                console.log('[Demo] Total node types:', activeRuntime.getNodeTypesSummary().length);
                
                // Create i18n service
                const i18nService = new I18nService({
                    manifestPath: '/html/locales/locales.json',
                    defaultLocale: 'en'
                });
                await i18nService.load();
                
                // Create workspace
                console.log('[Demo] Creating workspace...');
                workspace = new Workspace({
                    i18nService: i18nService
                });
                
                // Load workspace (this initializes config and loads any existing collections)
                console.log('[Demo] Loading workspace...');
                await workspace.load();
                
                // Get or create a collection for our demo
                collection = workspace.getActiveCollection();
                if (!collection) {
                    console.log('[Demo] No existing collections, creating new one...');
                    collection = await workspace.createCollection({
                        title: 'Demo Collection'
                    });
                }
                
                // Get the active graph from the collection
                nodeGraph = collection.getActiveGraph();
                console.log('[Demo] Using graph:', nodeGraph.name, 'from collection:', collection.getTitle());
                
                // Create icon provider with correct base path
                const iconProvider = new IconProvider({ basePath: '/html/icons' });
                
                // Create view manager
                console.log('[Demo] Creating ViewManager...');
                const appContainer = document.getElementById('app-container');
                viewManager = new ViewManager({
                    mount: appContainer,
                    logEvents: false,
                    theme: 'standard',
                    i18nService: i18nService
                });
                
                // Create header view (fixed size)
                const headerHtml = `
                    <div class="header-content">
                        <div>
                            <h1>Graph Panel Demo - Phase 4 Integration</h1>
                            <p>GraphPanelView + NodePaletteView with drag & drop support</p>
                        </div>
                        <div class="header-actions">
                            <button id="btn-serialize">Serialize</button>
                            <button id="btn-clear-graph">Clear Graph</button>
                            <button id="btn-zoom-fit">Zoom to Fit</button>
                        </div>
                    </div>
                `;
                const headerView = new HtmlView({
                    html: headerHtml,
                    title: 'Header',
                    scrollable: false,
                    minHeight: 70,
                    maxHeight: 70
                });
                
                // Create graph panel view (left side - 70% width)
                console.log('[Demo] Creating GraphPanelView...');
                graphPanelView = new GraphPanelView({
                    graph: nodeGraph,
                    collection: collection,
                    workspace: workspace,
                    viewManager: viewManager,
                    title: 'Graph Panel',
                    i18nService: i18nService,
                    logger: console,
                    onSelect: (nodeId) => {
                        console.log('[Demo] Node selected:', nodeId);
                    }
                });
                
                // Create palette view (right side - 30% width)
                console.log('[Demo] Creating NodePaletteView...');
                paletteView = new NodePaletteView({
                    deviceRuntime: activeRuntime,
                    workspaceConfig: workspace.config,
                    iconProvider: iconProvider,
                    i18nService: i18nService,
                    viewManager: viewManager,
                    logger: console
                });
                
                // Create horizontal split for graph panel (left) and palette (right)
                console.log('[Demo] Creating horizontal SplitView...');
                const contentSplit = new SplitView({
                    orientation: 'horizontal',
                    ratio: 0.7, // 70% graph panel, 30% palette
                    views: [graphPanelView, paletteView]
                });
                
                // Create vertical split for header and content
                console.log('[Demo] Creating vertical SplitView with fixed header...');
                const mainSplit = new SplitView({
                    orientation: 'vertical',
                    ratio: 70 / window.innerHeight, // Fixed 70px header
                    views: [headerView, contentSplit]
                });
                
                // Attach to view manager
                viewManager.attachRoot(mainSplit);
                
                console.log('[Demo] Initialization complete!');
                
                // Set up demo interactions
                setupDemoInteractions();
                
            } catch (error) {
                console.error('[Demo] Initialization error:', error);
                alert(`Failed to initialize demo: ${error.message}\n\nCheck console for details.`);
            }
        }
        
        function setupDemoInteractions() {
            // Serialize button - shows current state
            const btnSerialize = document.getElementById('btn-serialize');
            if (btnSerialize) {
                btnSerialize.addEventListener('click', () => {
                    const serialized = {
                        workspace: workspace.serialize(),
                        graphPanel: graphPanelView.serialize(),
                        palette: {
                            organizationMode: paletteView._organizationMode,
                            viewSize: paletteView._viewSize
                        }
                    };
                    
                    console.log('[Demo] Serialized state:', serialized);
                    alert('State serialized to console. Check DevTools Console for full output.');
                });
            }
            
            // Clear graph button - removes all nodes
            const btnClearGraph = document.getElementById('btn-clear-graph');
            if (btnClearGraph) {
                btnClearGraph.addEventListener('click', () => {
                    if (confirm('Clear all nodes from the graph?')) {
                        // Remove all nodes
                        const nodeIds = [...nodeGraph.nodes.keys()];
                        nodeIds.forEach(id => nodeGraph.removeNode(id));
                        console.log('[Demo] Graph cleared');
                    }
                });
            }
            
            // Zoom to fit button
            const btnZoomFit = document.getElementById('btn-zoom-fit');
            if (btnZoomFit) {
                btnZoomFit.addEventListener('click', () => {
                    if (graphPanelView._onZoomToFit) {
                        graphPanelView._onZoomToFit();
                        console.log('[Demo] Zoom to fit triggered');
                    } else {
                        console.warn('[Demo] Zoom to fit not implemented yet');
                    }
                });
            }
            
            // Monitor graph changes
            nodeGraph.onChange((event) => {
                const { type, data } = event;
                
                switch (type) {
                    case 'node-added':
                        console.log('[Demo] Node added:', data);
                        break;
                    case 'node-removed':
                        console.log('[Demo] Node removed:', data);
                        break;
                    case 'connection-added':
                        console.log('[Demo] Connection added:', data);
                        break;
                    case 'connection-removed':
                        console.log('[Demo] Connection removed:', data);
                        break;
                }
            }, 'demo-monitor');
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
