<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-Otter Node Editor</title>
    <link rel="icon" href="html/favicon.ico" type="image/x-icon">
    <!-- Marked library for markdown parsing in NodeInfoView -->
    <script src="html/vendor/marked/marked.umd.js"></script>
    <!-- Prism.js for syntax highlighting in CodeView -->
    <script src="html/vendor/prismjs/prism.js"></script>
    <script src="html/vendor/prismjs/components/prism-python.js"></script>
    <link rel="stylesheet" href="html/styles/standard/splash-screen.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* Initial loading screen with micro-otter icon */
        #initial-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top, #182033, #0e111b 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--mo-text, #e5eaf3);
            z-index: 9999;
        }
        #initial-loading img {
            width: 40vmin;
            height: 40vmin;
            max-width: 512px;
            max-height: 512px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 180ms ease;
        }
        #initial-loading img.is-loaded {
            opacity: 0.9;
            visibility: visible;
            animation: pulse 2s ease-in-out infinite;
        }
        #initial-loading-text {
            margin: 0;
            font-size: clamp(1.5rem, 3.5vw, 2.25rem);
            font-weight: 700;
            letter-spacing: 0.02em;
            color: inherit;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }
        #initial-loading-text .loading-dots {
            display: inline-block;
            width: 3ch;
            text-align: left;
            white-space: nowrap;
        }
        #initial-loading.is-icon-loading #initial-loading-text .loading-dots {
            width: 0;
            overflow: hidden;
            animation: loading-dots 1.1s steps(4, end) infinite;
        }
        @keyframes loading-dots {
            from { width: 0; }
            to { width: 3ch; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }
    </style>
</head>
<body>
    <div id="initial-loading" class="is-icon-loading">
        <p id="initial-loading-text">Micro-Otter<span class="loading-dots">...</span></p>
    </div>
    <script>
        const initialLoading = document.getElementById('initial-loading');
        const initialLoadingText = document.getElementById('initial-loading-text');
        if (initialLoading) {
            const initialLoadingIcon = new Image();
            let isResolved = false;
            let timeoutId = null;
            initialLoadingIcon.id = 'initial-loading-icon';
            initialLoadingIcon.alt = '';
            initialLoadingIcon.setAttribute('aria-hidden', 'true');

            const showInitialLoadingIcon = () => {
                if (isResolved) {
                    return;
                }
                isResolved = true;
                if (timeoutId !== null) {
                    clearTimeout(timeoutId);
                }
                initialLoading.insertBefore(initialLoadingIcon, initialLoadingText ?? initialLoading.firstChild);
                requestAnimationFrame(() => {
                    initialLoadingIcon.classList.add('is-loaded');
                });
                initialLoading.classList.remove('is-icon-loading');
            };

            const hideLoadingDots = () => {
                if (isResolved) {
                    return;
                }
                isResolved = true;
                if (timeoutId !== null) {
                    clearTimeout(timeoutId);
                }
                initialLoading.classList.remove('is-icon-loading');
            };

            const handleSlowLoadTimeout = () => {
                if (isResolved) {
                    return;
                }
                isResolved = true;
                initialLoading.classList.remove('is-icon-loading');
                if (initialLoadingText) {
                    initialLoadingText.textContent = 'taking unusually long...';
                }
            };

            initialLoadingIcon.addEventListener('load', showInitialLoadingIcon, { once: true });
            initialLoadingIcon.addEventListener('error', hideLoadingDots, { once: true });
            timeoutId = setTimeout(handleSlowLoadTimeout, 2000);
            initialLoadingIcon.src = 'html/icons/micro-otter-white-128px.svg';
        }
    </script>
    <script type="module" src="html/js/app/main.js"></script>
</body>
</html>
