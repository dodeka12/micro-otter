<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Micro-Otter Device</title>
    <style>
        :root {
            color-scheme: dark;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #121826, #05060a 65%);
            color: #e8ecff;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        main {
            text-align: center;
            position: relative;
            min-height: 70vh;
            width: min(960px, 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #otter-bg-logo {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 0;
        }
        #otter-bg-logo img {
            width: min(56vmin, 420px);
            height: auto;
            opacity: 0.13;
            filter: grayscale(1) brightness(0.42) contrast(1.05);
        }
        #otter-dom-root {
            position: relative;
            z-index: 1;
            width: 100%;
        }
        p {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 0.04em;
        }
        #otter-shell-debug {
            position: fixed;
            left: 0.75rem;
            bottom: 0.75rem;
            z-index: 9;
            margin: 0;
            padding: 0.5rem 0.65rem;
            background: rgba(0, 0, 0, 0.55);
            color: #d7dcf4;
            font-size: 0.72rem;
            line-height: 1.25;
            border-radius: 0.35rem;
            max-width: min(92vw, 560px);
            white-space: pre-wrap;
            word-break: break-word;
            letter-spacing: 0.01em;
        }
    </style>
</head>
<body>
    <main id="otter-runtime-shell">
        <div id="otter-bg-logo" aria-hidden="true">
            <img src="/micro-otter-128px-white.svg" alt="">
        </div>
        <section id="otter-dom-root" data-otter-dom-mount="true">
            <p>No package content is currently configured.</p>
        </section>
    </main>
</body>
</html>
