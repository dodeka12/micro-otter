# User documentation site. Only `user-docs/` is rendered: the developer markdown
# under `docs/` stays raw and is pointed at from `user-docs/developer-docs.md`.
# Build gate: `uv run mkdocs build --strict` (npm run check:docs).
site_name: Micro-Otter
site_description: Node-based MicroPython firmware design for ESP32-class boards
docs_dir: user-docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    # No `navigation.sections`: it renders the top-level groups (Setup, App, Nodes,
    # Addons) as fixed bold headers that cannot be folded. Without it each group is a
    # collapsible item that starts folded, so the sidebar opens on the section list.
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  version:
    provider: mike

