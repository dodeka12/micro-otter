[project]
name = "micro-otter"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Perwass", email = "christian@perwass.de" }
]
requires-python = ">=3.12"
dependencies = [
    "esptool>=5.1.0",
    "micropython-esp32-stubs>=1.26.0.post1",
    "mpremote>=1.27.0",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "websockets>=12.0",
    "typer>=0.12.5",
    "rich>=13.7.0",
]

[project.scripts]
micro-otter = "micro_otter.cli:main"
mo = "micro_otter.cli:main"

[build-system]
requires = [
    "hatchling>=1.25.0",
    "hatch-vcs>=0.4.0",
]
build-backend = "hatchling.build"

# The wheel is the only supported install artifact (locked decision 1). It ships
# runtime code only (`src/micro_otter`) plus two copied-in source paths, both
# produced by `deploy/packaging/build-wheel.sh`:
#   _dist/webapp      -> src/micro_otter/dist/webapp   the built web app
#   deploy/toolchain  -> micro_otter/toolchain/assets  the shared toolchain assets
# `artifacts` (not only `force-include`) is required for the bundle because
# `.gitignore` ignores `dist/`, and Hatchling's default file selection honours
# VCS ignores.
[tool.hatch.build.targets.wheel]
packages = ["src/micro_otter"]
artifacts = ["src/micro_otter/dist/webapp/**"]
force-include = { "deploy/toolchain" = "micro_otter/toolchain/assets" }

# Hatchling otherwise packs every VCS-tracked file into the sdist. The allowlist
# keeps the archive to the product. The sdist is a source archive for inspectors
# only: it cannot carry `src/micro_otter/dist/webapp`, so it is not an install path
# and `deploy/packaging/build-wheel.sh` never builds or ships it (locked decision 1).
[tool.hatch.build.targets.sdist]
include = [
    "/src/micro_otter",
    "/tools",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# A source archive without `.git` still has to build.
fallback_version = "0.0.0"
# This repository retired its `v*` tags to `archive/v*`; the public trunk keeps
# plain `v*` tags. Accept both so the derived version does not depend on which
# tree built the package.
tag_regex = '^(?:archive/)?(?:[\w-]+-)?(?P<version>[vV]?\d+(?:\.\d+){0,2}[^\+]*)(?:\+.*)?$'

[tool.hatch.build.hooks.vcs]
version-file = "src/micro_otter/_version.py"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
# The device tree is MicroPython firmware. Ruff cannot lint it correctly: viper
# intrinsics such as ``ptr16`` are undefined names (F821), ``UP038`` rewrites
# ``isinstance(x, (int, float))`` to PEP 604 unions which MicroPython rejects, and
# ``B905`` adds ``zip(strict=)`` which MicroPython's zip does not accept. That tree
# is gated by ``tools/check_device_syntax.py`` (mpy-cross) instead.
#
# The same applies to the device runtime assets staged into the firmware
# (``runtime_assets/otter_runtime``), to the transpiler output kept at the repo root
# (``main_loop.py``, "Auto-generated MicroPython code"), and to the generated
# webserver hook module.
extend-exclude = [
    "src/micro_otter/nodes/device",
    "src/micro_otter/tools/firmware_compile/runtime_assets",
    "examples/addons",
    "main_loop.py",
    "webserver_hooks_generated.py",
]
# Pre-commit passes explicit filenames, and ruff normally bypasses exclusions for
# paths given directly on the command line. Without force-exclude the device tree
# would still be linted (and --fix would rewrite it) by the pre-commit hook.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "W",
]

[tool.ruff.lint.flake8-bugbear]
# Typer builds CLI defaults via function calls in signatures; they are immutable
# and evaluated once, so B008 is a false positive.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[dependency-groups]
# Documentation site tooling (`uv sync --group docs`). `mike` publishes versioned
# builds of `user-docs/`; nothing here is imported by the runtime.
docs = [
    "mike>=2.1.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
dev = [
    "mpremote>=1.27.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pyinstaller>=6.0.0",
    # Linting. Keep the pin in lockstep with .pre-commit-config.yaml
    # (ruff-pre-commit rev) so editor, pre-commit and npm scripts agree.
    "ruff==0.6.9",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
]

[tool.pytest.ini_options]
# Tests import the top-level `tools/` development package, which is excluded from
# the wheel (phase 0). Put the repository root on sys.path so those imports
# resolve without `tools` being an installed package.
pythonpath = ["."]
